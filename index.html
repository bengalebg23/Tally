<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
  TALLY — HANDOFF NOTES (read this first in any new Claude chat)
  ═══════════════════════════════════════════════════════════════════════

  WHAT THIS IS
  A private, single-file PWA that replaces Ben's Track & Graph intimacy
  logging. Neutral name on purpose so the home-screen icon is discreet.

  DATA MODEL (sessions with tags, not separate trackers)
  In Track & Graph each "time" was logged by tapping several trackers within
  the same minute (PIV + B-Orgasm + E-Orgasm + Satisfyer…). Tally stores one
  SESSION per time, with a set of TAGS, inside a GROUP:
    db = {
      groups:   [{id, name, color, tags:[name…]}],     e.g. Sex, Masturbate
      sessions: [{id, g, t, tags:[name…], note}],      t = epoch ms
      counters: [{id, name, g, tag|null, color}]       "time since" cards
    }
  A counter with tag=null counts every session in its group.

  SECURITY / STORAGE (v1.2.0)
  - The repo is public and has no sign-in, so the data is END-TO-END
    ENCRYPTED: a random 48-byte vault secret = 16-byte vault id + 32-byte
    AES-GCM data key. The whole db is JSON → AES-GCM → {iv, ct, v}.
  - The vault secret is wrapped with a key derived from the PIN (PBKDF2,
    310k × SHA-256) and kept in localStorage (VAULT_KEY). The encrypted blob
    is cached in localStorage (BLOB_KEY) and pushed to Firebase RTDB at
    vaults/<vault id>. Nothing readable is stored anywhere.
  - Recovery code = "TALLY1 " + base64url(vault secret) in groups of 8. It
    adds the vault to a new device or resets a forgotten PIN. Lose both PIN
    and code → data is unrecoverable (by design).
  - FIREBASE_CONFIG = {databaseURL, projectId} of tally-85dd6; null → this device only.
  - Sync: debounced full-blob set(); onValue replaces local if newer, or
    merges (union by id, local wins) when there are unsynced local edits.
  - Locks on every launch and after LOCK_AFTER of being in the background.
    5 wrong PINs → lockout that doubles from 30 s.
  - RTDB rules for the Tally project (root closed, vault path only):
      { "rules": { ".read": false, ".write": false,
          "vaults": { "$vault": { ".read": "$vault.length === 32",
            ".write": "$vault.length === 32",
            ".validate": "newData.hasChildren(['iv','ct','v'])" } } } }

  IMPORT (importCSV)
  - Track & Graph CSV: FeatureName,Timestamp,Value,Label,Note (+ legacy form).
  - Group = name in the filename ("TrackAndGraph-Sex-2026…csv" → Sex,
    trailing "_" dropped), or the existing group that already has most of the
    file's feature names as tags, else asks.
  - Rows within SESSION_WINDOW (15 min) of a session's start join it, unless
    that tag is already in it (then a new session starts).
  - Features whose values aren't 1 (e.g. "Trial", a days-since figure) are
    skipped — Tally works gaps out itself. Labels become extra tags.
  - Re-importing skips sessions already present (same group, start minute and tags).

  EXPORT: JSON backup; CSV in Track & Graph format (one row per tag).

  ARCHITECTURE: index.html (vanilla JS, no libraries, hand-drawn SVG charts)
  + sw.js. Look matches MoneyFlow / MealRota (Inter, IBM Plex Mono, Patrick
  Hand, #F7F8FA ground, white cards, #2F6FE4 accent).

  CHANGELOG
  v1.5.0 — "What's normal": each Now card shows where today's gap sits against
           a baseline (median, 25–75% usual band, average) with calm wording
           (normBlock). Baseline period picker: 3/6/12 months, each year, all
           time, plus named custom month ranges saved in db.periods (synced).
           Charts get a "What's normal" card (gap histogram + typical gap by
           year) and the gap stats follow the chosen period.
  v1.4.0 — Long-press (0.4 s) then drag to reorder chart cards (order kept per
           device in ui.chartOrder, "reset order" link) and Now counters
           (order saved to db, so it syncs). makeSortable() does both.
  v1.3.0 — Log/edit sheet: month calendar (Mon-first, future days off, dots
           on days that already have a session in the chosen group) plus a
           time box and "Now" button, replacing the datetime scroller.
  v1.2.1 — Connected to Firebase project tally-85dd6 (RTDB europe-west1).
  v1.2.0 — End-to-end encrypted vault with PIN lock, recovery code and
           Firebase RTDB sync. Plain v1.1 local data is migrated into the
           vault and the plaintext copy deleted. Settings: lock now, change
           PIN, show recovery code, remove from device.
  v1.1.0 — Rebuilt around sessions + tags + groups after seeing the real
           exports. Now = counter cards (time since, last session's tags);
           Charts per group with tag filter, tag mix / "often with" card;
           Log shows sessions with tag chips; one-tap multi-tag logging;
           Settings manages groups, tags and counters.
  v1.0.0 — First version (one entry per tracker). Never deployed.
  ═══════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
<title>Tally v1.5.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#EEF1F5; --line:#D7DCE3;
    --paper:#26313F; --paper-dim:#5b6b7d; --muted:#6b7a8c;
    --mustard:#2F6FE4; --mustard-dim:#1f4fb0; --rose:#F0703C; --today:#2FA84F; --gap:#e34948;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--paper); font-family:'Inter',system-ui,sans-serif; min-height:100vh; padding-bottom:110px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  header.top{
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 80%, transparent); backdrop-filter:blur(6px);
  }
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 2px;}
  h1.title{font-family:'Patrick Hand',cursive; font-size:28px; margin:0; font-weight:400;}
  .title-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 9px;}
  .title-right{display:flex; align-items:center; gap:8px;}
  .version-badge{flex:none; font-size:11px; font-weight:600; color:var(--mustard); background:var(--surface); border:1px solid var(--mustard-dim); padding:4px 9px; border-radius:20px;}
  .icon-btn{width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--paper); cursor:pointer; display:grid; place-items:center; padding:0;}
  .icon-btn svg{width:18px; height:18px;}
  .tabs{display:flex; gap:5px;}
  .tab{flex:1; text-align:center; padding:7px 0 6px; border-radius:9px; background:var(--surface); border:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--paper-dim); cursor:pointer; transition:background .15s,color .15s;}
  .tab.active{background:var(--mustard); color:#fff; border-color:var(--mustard);}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--mustard); outline-offset:2px;}

  main{max-width:720px; margin:0 auto; padding:16px 18px 0; display:grid; gap:14px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; position:relative; min-width:0;}
  .card-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:0 0 10px;}
  .card-h h2{font-family:'Patrick Hand',cursive; font-weight:400; font-size:22px; margin:0; line-height:1.1;}
  .card-h .sub{font-size:12px; color:var(--muted); text-align:right;}

  /* Now tab */
  .ctr{display:grid; gap:6px; padding:14px 14px 12px; border-left:5px solid var(--c,var(--mustard));}
  .ctr-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .ctr-name{font-family:'Patrick Hand',cursive; font-size:23px; line-height:1;}
  .ctr-name small{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-left:6px;}
  .since{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:clamp(22px,6.4vw,30px); font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
  .since .u{font-size:.55em; font-weight:500; color:var(--paper-dim); margin:0 6px 0 2px;}
  .last{font-size:12.5px; color:var(--paper-dim);}
  .meta{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}
  .meta b{color:var(--paper); font-weight:600;}
  .plus{width:40px; height:40px; border-radius:11px; border:none; background:var(--c,var(--mustard)); color:#fff; font:600 24px 'Inter',sans-serif; cursor:pointer; flex:none; line-height:1;}
  .mini-tags{display:flex; flex-wrap:wrap; gap:4px;}
  .mt{font-size:11px; padding:2px 7px; border-radius:6px; background:var(--surface-2); color:var(--paper-dim);}
  .mt.hl{background:var(--c); color:#fff;}
  .empty{padding:26px 16px; text-align:center; color:var(--paper-dim); font-size:14px; display:grid; gap:12px; justify-items:center;}

  /* chips */
  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chips.wrap{flex-wrap:wrap; overflow:visible;}
  .chip{flex:none; font:600 12.5px 'Inter',sans-serif; padding:6px 11px; border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--paper-dim); cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .chip i{width:8px; height:8px; border-radius:50%; background:var(--c);}
  .chip.on{background:var(--paper); border-color:var(--paper); color:#fff;}
  .chip.tag.on{background:var(--c); border-color:var(--c);}
  .chip.add{border-style:dashed;}
  .chip .n{font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.7; font-weight:500;}

  /* charts */
  .stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
  @media (min-width:560px){ .stats{grid-template-columns:repeat(4,minmax(0,1fr));} }
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; display:grid; gap:2px; min-width:0;}
  .stat .k{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  .stat .v{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:22px; font-variant-numeric:tabular-nums;}
  .stat .s{font-size:11.5px; color:var(--paper-dim);}
  svg.chart{display:block; width:100%; height:auto; overflow:visible;}
  .ax{font:10px 'IBM Plex Mono',monospace; fill:var(--muted);}
  .grid{stroke:var(--surface-2); stroke-width:1;}
  .base{stroke:var(--line); stroke-width:1;}
  .legend{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:11.5px; color:var(--paper-dim); margin-top:6px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:14px; height:3px; border-radius:2px; display:inline-block; background:var(--c);}
  .legend i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px);}
  .hbar{display:grid; grid-template-columns:minmax(110px,1.3fr) 2fr 44px; gap:8px; align-items:center; font-size:12.5px; margin:5px 0;}
  .hbar .bar{height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden;}
  .hbar .bar i{display:block; height:100%; background:var(--c); border-radius:5px;}
  .hbar .n{text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .hbar .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .seg button{font:600 11px 'IBM Plex Mono',monospace; padding:4px 8px; border:0; background:var(--surface); color:var(--paper-dim); cursor:pointer;}
  .seg button.on{background:var(--paper); color:#fff;}

  /* log */
  .search{width:100%; font:inherit; font-size:14px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--paper);}
  .month-h{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:6px 2px -4px; display:flex; justify-content:space-between;}
  .rows{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .row{display:grid; grid-template-columns:4px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 12px 10px 0; border-top:1px solid var(--surface-2); cursor:pointer; width:100%; background:none; border-left:0; border-right:0; border-bottom:0; text-align:left; font:inherit; color:inherit;}
  .row:first-child{border-top:0;}
  .row > i{align-self:stretch; background:var(--c); border-radius:0 3px 3px 0;}
  .row .nm{font-weight:600; font-size:13.5px; margin-bottom:4px;}
  .row .nt{font-size:11.5px; color:var(--paper-dim); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .dt{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--paper-dim); text-align:right; line-height:1.35;}
  .more{justify-self:center;}

  /* buttons, sheets */
  .btn{font:inherit; font-size:13.5px; font-weight:600; padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--paper); cursor:pointer;}
  .btn.primary{background:var(--mustard); border-color:var(--mustard); color:#fff;}
  .btn.danger{color:var(--gap); border-color:#f1c2c2;}
  .btn.block{width:100%;}
  .btn.sm{font-size:12.5px; padding:6px 10px;}
  .btns{display:flex; gap:8px; flex-wrap:wrap;}
  .fab{position:fixed; right:18px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); width:58px; height:58px; border-radius:17px; border:none; background:var(--mustard); color:#fff; font:500 30px 'Inter',sans-serif; box-shadow:0 6px 18px rgba(47,111,228,.35); cursor:pointer; z-index:40;}
  .scrim{position:fixed; inset:0; background:rgba(38,49,63,.35); z-index:50;}
  .sheet{position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:min(560px,100%); max-height:90vh; overflow:auto; background:var(--surface); border-radius:18px 18px 0 0; padding:16px 18px calc(22px + env(safe-area-inset-bottom,0px)); z-index:51; box-shadow:0 -8px 30px rgba(38,49,63,.18); display:grid; gap:14px;}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .sheet h3{margin:0; font-family:'Patrick Hand',cursive; font-size:26px; font-weight:400; line-height:1.1;}
  .x{border:1px solid var(--line); background:var(--surface-2); border-radius:9px; width:32px; height:32px; cursor:pointer; color:var(--paper); font-size:14px; flex:none;}
  .x:disabled{opacity:.35; cursor:default;}
  .field{display:grid; gap:5px;}
  .field > span, .lbl{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  .field input, .field select, .field textarea{font:inherit; font-size:15px; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--paper); width:100%; min-width:0;}
  .field textarea{min-height:56px; resize:vertical;}
  .tagsec{display:grid; gap:6px;}
  .per-wrap{display:grid; gap:6px;}
  .per-wrap .lbl{margin-left:2px;}
  .chips.per .chip{font-size:12px; padding:5px 10px;}
  .norm{display:grid; gap:5px; margin:4px 0 2px; padding:9px 10px 8px; background:var(--surface-2); border-radius:10px;}
  .norm-line{font-size:13px; color:var(--paper-dim); line-height:1.35;}
  .norm-line b{color:var(--paper);}
  .norm-sub{font-size:11.5px; color:var(--paper-dim); font-family:'IBM Plex Mono',monospace;}
  .muted{color:var(--muted);}
  .nbar{position:relative; height:12px; border-radius:6px; background:var(--surface); border:1px solid var(--line); margin:2px 0;}
  .nbar .band{position:absolute; top:1px; bottom:1px; border-radius:5px; background:color-mix(in srgb, var(--c) 28%, transparent);}
  .nbar .med{position:absolute; top:-2px; bottom:-2px; width:2px; margin-left:-1px; background:var(--paper-dim); border-radius:1px;}
  .nbar .cur{position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--c); border:2px solid var(--surface); box-shadow:0 1px 3px rgba(38,49,63,.3);}
  html.no-anchor, html.no-anchor body{overflow-anchor:none;}
  main, #sortNow, #sortCharts, .per-wrap{grid-template-columns:minmax(0,1fr);}
  .dz{min-width:0; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; position:relative;}
  .dz.lifted{z-index:30; filter:drop-shadow(0 10px 22px rgba(38,49,63,.25)); opacity:.97;}
  .dz.lifted.card, .dz.lifted > .card, .dz.lifted > .stats{outline:2px solid var(--mustard); outline-offset:-1px; border-radius:var(--radius);}
  .cal{border:1px solid var(--line); border-radius:12px; padding:8px 8px 6px;}
  .cal-h{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .cal-h span{font-weight:600; font-size:14.5px;}
  .cal-g{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center;}
  .cal-g .dh{font:10px 'IBM Plex Mono',monospace; color:var(--muted); padding:4px 0 2px;}
  .cal-g .d{height:40px; border:0; background:none; border-radius:50%; font:500 14.5px 'Inter',sans-serif; color:var(--paper); position:relative; cursor:pointer; padding:0; width:40px; justify-self:center;}
  .cal-g .d:disabled{color:var(--line); cursor:default;}
  .cal-g .d.today{box-shadow:inset 0 0 0 1.5px var(--mustard); color:var(--mustard); font-weight:700;}
  .cal-g .d.sel{background:var(--mustard); color:#fff; box-shadow:none;}
  .cal-g .d.has::after{content:''; position:absolute; bottom:5px; left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--c);}
  .cal-g .d.sel.has::after{background:#fff;}
  .time-row{display:flex; gap:8px; align-items:center;}
  .time-row input{flex:1; font:600 17px 'IBM Plex Mono',monospace; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--paper); min-width:0;}
  .sec{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:6px 0 -6px; border-top:1px solid var(--surface-2); padding-top:12px;}
  .srow{display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:8px; align-items:center;}
  .srow input[type=color]{width:34px; height:34px; padding:0; border:1px solid var(--line); border-radius:9px; background:none;}
  .srow input[type=text], .srow select{font:inherit; font-size:14px; padding:7px 10px; border-radius:9px; border:1px solid var(--line); min-width:0; background:var(--surface); color:var(--paper); width:100%;}
  .srow .pair{display:grid; grid-template-columns:1fr 1fr; gap:6px; min-width:0;}
  .help{font-size:12.5px; color:var(--paper-dim); margin:0; line-height:1.45;}
  /* lock / setup */
  body.locked header.top, body.locked main, body.locked .fab{display:none !important;}
  #lock{position:fixed; inset:0; z-index:80; background:var(--bg); overflow:auto; display:flex; flex-direction:column; align-items:center; padding:calc(40px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));}
  .lk{width:100%; max-width:360px; display:grid; gap:16px; justify-items:center; text-align:center;}
  .lk-logo{width:56px; height:56px; border-radius:15px;}
  .lk h2{font-family:'Patrick Hand',cursive; font-weight:400; font-size:30px; margin:0; line-height:1.1;}
  .lk p{margin:0; font-size:13.5px; color:var(--paper-dim); line-height:1.5;}
  .lk .err{color:var(--gap); font-weight:600; min-height:1.3em;}
  .dots{display:flex; gap:12px; min-height:16px; justify-content:center;}
  .dots i{width:14px; height:14px; border-radius:50%; border:2px solid var(--paper-dim);}
  .dots i.f{background:var(--paper); border-color:var(--paper);}
  .dots.shake{animation:shake .35s;}
  @keyframes shake{20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)}}
  .pad{display:grid; grid-template-columns:repeat(3,72px); gap:14px; justify-content:center; margin-top:4px;}
  .pad button{width:72px; height:72px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--paper); font:500 26px 'IBM Plex Mono',monospace; cursor:pointer; box-shadow:0 1px 3px rgba(38,49,63,.06);}
  .pad button:active{background:var(--surface-2);}
  .pad button.k{border:none; background:none; box-shadow:none; font-size:20px; color:var(--paper-dim);}
  .pad button.ok{background:var(--mustard); color:#fff; border-color:var(--mustard); font-size:22px;}
  .pad button:disabled{opacity:.3;}
  .code{font-family:'IBM Plex Mono',monospace; font-size:14.5px; line-height:1.7; letter-spacing:.02em; background:var(--surface); border:1px dashed var(--mustard-dim); border-radius:12px; padding:12px 14px; word-break:break-all; user-select:all; -webkit-user-select:all; width:100%; text-align:left;}
  .lk textarea{width:100%; min-height:92px; font:14px 'IBM Plex Mono',monospace; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--paper); resize:vertical;}
  .lk .btn{width:100%;}
  .linkbtn{background:none; border:none; color:var(--mustard); font:600 13.5px 'Inter',sans-serif; cursor:pointer; padding:6px;}

</style>
</head>

<button class="fab" id="fab" aria-label="Log a session">+</button>
<input type="file" id="fileIn" accept=".csv,.json,text/csv,application/json" multiple hidden>

<script>
'use strict';
const VERSION = '1.5.0';
const STORE_KEY = 'tally.v1';
const UI_KEY = 'tally.ui';
const SESSION_WINDOW = 15 * 60000;
const PALETTE = ['#2F6FE4','#e34948','#1baf7a','#eda100','#e87ba4','#4a3aa7','#F0703C','#0f9bb5'];
const DAY = 86400000;

/* ───────── data ───────── */
// Tally Firebase project (RTDB only needs databaseURL). Set to null to run on this device only.
const FIREBASE_CONFIG = {
  databaseURL: 'https://tally-85dd6-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'tally-85dd6'
};
const FB_SDK = '10.7.1';
const VAULT_KEY = 'tally.vault';   // PIN-wrapped vault secret
const BLOB_KEY = 'tally.blob';     // encrypted db cache {iv, ct, v}
const FAIL_KEY = 'tally.fails';
const LOCK_AFTER = 60000;
const PBKDF2_ITER = 310000;

const emptyDb = () => ({groups:[], sessions:[], counters:[], periods:[]});
let db = emptyDb();
let ui = Object.assign({tab:'now', cg:null, ctag:null, crange:'all', mixRange:'12m', lg:'all', q:'', limit:120}, loadUI());
ui.limit = 120; ui.q = '';

function normalize(d){
  d = d && typeof d === 'object' ? d : {};
  return {groups: Array.isArray(d.groups) ? d.groups.map(g => Object.assign({tags:[]}, g)) : [],
          sessions: Array.isArray(d.sessions) ? d.sessions.map(s => Object.assign({tags:[], note:''}, s)).sort((a,b) => b.t - a.t) : [],
          counters: Array.isArray(d.counters) ? d.counters : [],
          periods: Array.isArray(d.periods) ? d.periods : []};
}
function loadUI(){ try{ return JSON.parse(localStorage.getItem(UI_KEY)) || {}; }catch(e){ return {}; } }
// UI state is not encrypted, so it never stores tag names
function saveUI(){ try{ localStorage.setItem(UI_KEY, JSON.stringify({tab:ui.tab, cg:ui.cg, crange:ui.crange, mixRange:ui.mixRange, lg:ui.lg, chartOrder:ui.chartOrder||null, period:ui.period||null})); }catch(e){} }

/* ───────── crypto ───────── */
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf){ const u = new Uint8Array(buf); let s = ''; for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64url = u => b64(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64url = s => unb64(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length+3)%4));
const hex = u => [...u].map(b => b.toString(16).padStart(2,'0')).join('');
async function pinKey(pin, salt){
  const base = await crypto.subtle.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:PBKDF2_ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function aesEnc(key, bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes); return {iv:b64(iv), ct:b64(ct)}; }
async function aesDec(key, o){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv)}, key, unb64(o.ct))); }
async function openVault(raw){ return {raw, vid: hex(raw.slice(0,16)), key: await crypto.subtle.importKey('raw', raw.slice(16), 'AES-GCM', false, ['encrypt','decrypt'])}; }
function recoveryCode(raw){ return 'TALLY1 ' + b64url(raw).match(/.{1,8}/g).join(' '); }
function parseRecovery(text){
  const t = String(text||'').replace(/^\s*TALLY1/i, '').replace(/\s+/g, '');
  if(!/^[A-Za-z0-9_-]{64}$/.test(t)) return null;
  try{ const raw = unb64url(t); return raw.length === 48 ? raw : null; }catch(e){ return null; }
}
async function wrapVault(raw, pin){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const o = await aesEnc(await pinKey(pin, salt), raw);
  localStorage.setItem(VAULT_KEY, JSON.stringify({vid:hex(raw.slice(0,16)), salt:b64(salt), iv:o.iv, ct:o.ct, n:pin.length}));
}
const vaultRec = () => { try{ return JSON.parse(localStorage.getItem(VAULT_KEY)); }catch(e){ return null; } };

/* ───────── vault state + sync ───────── */
let V = null;              // unlocked vault {raw, vid, key}
let lastV = 0, dirty = false, pendingBlob = null, pushT = null, saveSeq = Promise.resolve();
let fbApp = null, fbRef = null, fbConn = null, online = null, pendingRender = false;

function save(){
  if(!V) return;
  dirty = true; lastV = Date.now();
  const snap = JSON.stringify(db), v = lastV, vault = V;
  setSync();
  saveSeq = saveSeq.then(async () => {
    const o = await aesEnc(vault.key, te.encode(snap)); o.v = v;
    try{ localStorage.setItem(BLOB_KEY, JSON.stringify(o)); }catch(e){ toast('Could not save on this device — storage full?'); }
    pendingBlob = o; schedulePush();
  }).catch(e => toast('Encryption failed: ' + e.message));
}
function schedulePush(){ clearTimeout(pushT); pushT = setTimeout(push, 700); }
async function push(){
  if(!fbRef || !pendingBlob) { if(!fbRef) setSync(); return; }
  const o = pendingBlob;
  try{ await fbRef.set(o); if(pendingBlob === o){ pendingBlob = null; dirty = false; } setSync(); }
  catch(e){ setSync('Sync error — ' + e.message); }
}
function setSync(err){
  const el = document.getElementById('syncLine'); if(!el) return;
  let t = 'Encrypted';
  if(err) t += ' · ' + err;
  else if(!FIREBASE_CONFIG) t += ' · this device only';
  else if(!fbRef) t += ' · connecting…';
  else if(online === false) t += dirty ? ' · offline, will sync' : ' · offline';
  else t += dirty ? ' · syncing…' : ' · synced';
  el.textContent = t;
}
function mergeDb(local, remote){
  const byId = (a, b) => { const m = new Map(); b.forEach(x => m.set(x.id, x)); a.forEach(x => m.set(x.id, x)); return [...m.values()]; };
  const out = normalize({groups: byId(local.groups, remote.groups), sessions: byId(local.sessions, remote.sessions), counters: local.counters.length ? local.counters : remote.counters, periods: byId(local.periods||[], remote.periods||[])});
  out.groups.forEach(g => { const rg = remote.groups.find(x => x.id === g.id); if(rg) rg.tags.forEach(t => ensureTag(g, t)); });
  return out;
}
async function onRemote(snap){
  const o = snap.val(), vault = V; if(!vault) return;
  if(!o || !o.ct){ if(db.groups.length || db.sessions.length){ dirty = true; pendingBlob = null; save(); } return; }
  if(o.v <= lastV) return;
  try{
    const remote = normalize(JSON.parse(td.decode(await aesDec(vault.key, o))));
    if(vault !== V) return;
    if(dirty){ db = mergeDb(db, remote); save(); }
    else { db = remote; lastV = o.v; try{ localStorage.setItem(BLOB_KEY, JSON.stringify(o)); }catch(e){} }
    refresh(); setSync();
  }catch(e){ setSync('synced data could not be decrypted'); }
}
function refresh(){ if(sheetEl || dragging) pendingRender = true; else render(); }
function loadScript(src){ return new Promise((res, rej) => { if(document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('could not load Firebase')); document.head.append(s); }); }
async function startSync(){
  setSync();
  if(!FIREBASE_CONFIG || !V) return;
  try{
    if(!window.firebase || !firebase.database){
      await loadScript(`https://www.gstatic.com/firebasejs/${FB_SDK}/firebase-app-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${FB_SDK}/firebase-database-compat.js`);
    }
    fbApp = fbApp || (firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG));
    const dbase = fbApp.database();
    fbConn = dbase.ref('.info/connected'); fbConn.on('value', s => { online = !!s.val(); setSync(); if(online && pendingBlob) schedulePush(); });
    fbRef = dbase.ref('vaults/' + V.vid);
    fbRef.on('value', onRemote, err => setSync('Sync error — ' + err.message));
    if(pendingBlob) schedulePush();
  }catch(e){ fbRef = null; setSync('offline (' + e.message + ')'); }
}
function stopSync(){ if(fbRef) fbRef.off(); if(fbConn) fbConn.off(); fbRef = null; fbConn = null; }

/* ───────── lock / setup screens ───────── */
const lockEl = document.createElement('div'); lockEl.id = 'lock'; lockEl.hidden = true;
const LOGO = `<svg class="lk-logo" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#2F6FE4"/><g stroke="#fff" stroke-width="34" stroke-linecap="round"><line x1="150" y1="150" x2="150" y2="362"/><line x1="222" y1="150" x2="222" y2="362"/><line x1="294" y1="150" x2="294" y2="362"/><line x1="366" y1="150" x2="366" y2="362"/><line x1="110" y1="330" x2="404" y2="190"/></g></svg>`;
function showLock(html){ document.onkeydown = null; document.body.classList.add('locked'); lockEl.hidden = false; lockEl.innerHTML = `<div class="lk">${html}</div>`; lockEl.scrollTop = 0; return lockEl.firstChild; }
function hideLock(){ document.onkeydown = null; document.body.classList.remove('locked'); lockEl.hidden = true; lockEl.innerHTML = ''; }

// A PIN pad. len = fixed length (auto-submits) or null (4–8 digits with ✓).
function pinScreen({title, sub = '', len = null, extra = '', onPin}){
  const box = showLock(`${LOGO}<h2>${esc(title)}</h2>${sub ? `<p>${sub}</p>` : ''}
    <div class="dots" aria-live="polite"></div><p class="err" role="alert"></p>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-d="${n}">${n}</button>`).join('')}
      <button class="k" data-back aria-label="Delete">⌫</button><button data-d="0">0</button>
      ${len ? '<span></span>' : '<button class="ok" data-ok aria-label="Done">✓</button>'}</div>${extra}`);
  let pin = '', busy = false;
  const dots = box.querySelector('.dots'), err = box.querySelector('.err');
  const draw = () => { const n = len || Math.max(4, pin.length); dots.innerHTML = Array.from({length:n}, (_,i) => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join(''); const ok = box.querySelector('[data-ok]'); if(ok) ok.disabled = pin.length < 4; };
  const fail = msg => { err.textContent = msg; dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); pin = ''; draw(); };
  const submit = async () => {
    if(busy || pin.length < 4) return; busy = true; err.textContent = '…';
    const msg = await onPin(pin); busy = false;
    if(msg && lockEl.contains(box)) fail(msg);
  };
  const press = k => {
    if(busy) return; err.textContent = err.textContent === '…' ? '' : err.textContent;
    if(k === 'back') pin = pin.slice(0,-1);
    else if(k === 'ok') return submit();
    else if(pin.length < (len || 8)) pin += k;
    draw(); if(len && pin.length === len) submit();
  };
  box.querySelector('.pad').addEventListener('click', ev => { const b = ev.target.closest('button'); if(!b) return; press(b.dataset.d ?? (b.hasAttribute('data-back') ? 'back' : 'ok')); });
  document.onkeydown = ev => { if(!lockEl.contains(box)) return; if(/^\d$/.test(ev.key)) press(ev.key); else if(ev.key === 'Backspace') press('back'); else if(ev.key === 'Enter') press('ok'); };
  draw(); return box;
}
function choosePin(title, sub, done){
  pinScreen({title, sub: sub || 'Pick a 4–8 digit PIN. Six or more is stronger.', onPin: async p1 => {
    pinScreen({title:'Confirm PIN', sub:'Enter it again.', len:p1.length, onPin: async p2 => {
      if(p2 !== p1){ setTimeout(() => choosePin(title, 'Those didn\'t match — try again.', done), 600); return 'PINs didn\'t match'; }
      await done(p1); return null;
    }});
    return null;
  }});
}
function welcomeScreen(){
  const box = showLock(`${LOGO}<h2>Set up Tally</h2>
    <p>Everything is encrypted on this phone before it's stored${FIREBASE_CONFIG ? ' or synced' : ''}. You'll pick a PIN to open it, and get a recovery code for adding another device or if you forget the PIN.</p>
    ${FIREBASE_CONFIG ? '' : '<p style="color:var(--rose)">Sync isn\'t set up yet — data stays on this device until it is.</p>'}
    <button class="btn primary" data-new>Start a new Tally</button>
    <button class="btn" data-join>I have a recovery code</button>`);
  box.querySelector('[data-new]').onclick = () => choosePin('Choose a PIN', '', async pin => {
    const raw = crypto.getRandomValues(new Uint8Array(48));
    await wrapVault(raw, pin);
    V = await openVault(raw); localStorage.removeItem(BLOB_KEY);
    migratePlain();
    showRecovery(true);
  });
  box.querySelector('[data-join]').onclick = () => joinScreen(false);
}
function joinScreen(fromLock){
  const box = showLock(`${LOGO}<h2>${fromLock ? 'Reset PIN' : 'Add this device'}</h2>
    <p>Paste your recovery code (it starts TALLY1).${fromLock ? ' Your data stays as it is; you\'ll choose a new PIN.' : ''}</p>
    <textarea id="rc" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="TALLY1 xxxxxxxx xxxxxxxx …"></textarea>
    <p class="err"></p>
    <button class="btn primary" data-go>Continue</button>
    <button class="linkbtn" data-back>Back</button>`);
  box.querySelector('[data-back]').onclick = () => vaultRec() ? lockScreen() : welcomeScreen();
  box.querySelector('[data-go]').onclick = () => {
    const raw = parseRecovery(box.querySelector('#rc').value);
    if(!raw){ box.querySelector('.err').textContent = 'That doesn\'t look like a full recovery code.'; return; }
    const cur = vaultRec();
    choosePin('New PIN', '', async pin => {
      const nv = await openVault(raw);
      const switching = !cur || (cur.vid ? cur.vid !== nv.vid : !V || V.vid !== nv.vid);
      await wrapVault(raw, pin); localStorage.removeItem(FAIL_KEY);
      if(switching){ localStorage.removeItem(BLOB_KEY); db = emptyDb(); lastV = 0; dirty = false; pendingBlob = null; }
      V = nv; await afterUnlock(); migratePlain(); toast(FIREBASE_CONFIG ? 'Unlocked — fetching your data' : 'Unlocked');
    });
  };
}
function showRecovery(first){
  const code = recoveryCode(V.raw);
  const box = showLock(`${LOGO}<h2>Your recovery code</h2>
    <p>Save this somewhere private — a password manager is ideal. It's the only way to add another device or get back in if you forget your PIN. Anyone with it can read your data, so don't share it.</p>
    <div class="code">${code.split(' ').map(w => `<span style="display:inline-block;margin-right:.6em">${esc(w)}</span>`).join('')}</div>
    <button class="btn" data-copy>Copy code</button>
    ${first ? `<label class="chk"><input type="checkbox" id="saved"> I've saved it somewhere safe</label>` : ''}
    <button class="btn primary" data-done ${first ? 'disabled' : ''}>${first ? 'Continue' : 'Done'}</button>`);
  box.querySelector('[data-copy]').onclick = async () => { try{ await navigator.clipboard.writeText(code); toast('Copied'); }catch(e){ toast('Copy failed — select the code and copy it'); } };
  const done = box.querySelector('[data-done]');
  if(first) box.querySelector('#saved').onchange = ev => done.disabled = !ev.target.checked;
  done.onclick = () => first ? afterUnlock() : (hideLock(), render());
}
function failState(){ try{ return JSON.parse(localStorage.getItem(FAIL_KEY)) || {n:0, until:0}; }catch(e){ return {n:0, until:0}; } }
function lockScreen(msg){
  const rec = vaultRec(); if(!rec) return welcomeScreen();
  const box = pinScreen({title:'Tally', sub: msg || 'Enter your PIN', len: rec.n, extra:'<button class="linkbtn" data-forgot>Forgot PIN?</button>', onPin: async pin => {
    const f = failState(), now = Date.now();
    if(f.until > now) return `Too many tries — wait ${Math.ceil((f.until-now)/1000)} s`;
    try{
      const raw = await aesDec(await pinKey(pin, unb64(rec.salt)), rec);
      localStorage.removeItem(FAIL_KEY);
      V = await openVault(raw); await afterUnlock(); return null;
    }catch(e){
      f.n++; if(f.n >= 5) f.until = now + 30000 * Math.pow(2, f.n - 5);
      localStorage.setItem(FAIL_KEY, JSON.stringify(f));
      return f.until > now ? `Wrong PIN — locked for ${Math.ceil((f.until-now)/1000)} s` : 'Wrong PIN';
    }
  }});
  box.querySelector('[data-forgot]').onclick = () => joinScreen(true);
}
async function afterUnlock(){
  // load the encrypted local copy, then go live
  if(!lastV){
    try{ const o = JSON.parse(localStorage.getItem(BLOB_KEY)); if(o && o.ct){ db = normalize(JSON.parse(td.decode(await aesDec(V.key, o)))); lastV = o.v || 1; } }
    catch(e){ toast('Local copy could not be read — will use synced data'); }
  }
  hideLock(); render(); startSync();
}
function migratePlain(){
  // v1.1 kept plain JSON in STORE_KEY — move it into the vault and delete it
  const plain = localStorage.getItem(STORE_KEY); if(!plain) return;
  try{ const d = normalize(JSON.parse(plain)); if(d.sessions.length || d.groups.length){ db = db.sessions.length ? mergeDb(d, db) : d; save(); toast(`Moved ${d.sessions.length} session${d.sessions.length===1?'':'s'} into the encrypted vault`); } }catch(e){}
  localStorage.removeItem(STORE_KEY);
}
function lock(){
  if(!V) return;
  closeSheet(); stopSync(); clearInterval(tick);
  V = null; db = emptyDb(); lastV = 0; dirty = false; pendingBlob = null; view.innerHTML = '';
  lockScreen();
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const grp = id => db.groups.find(g => g.id === id);
const sessOf = gid => db.sessions.filter(s => s.g === gid);
const nextColor = () => PALETTE[(db.groups.length + db.counters.length) % PALETTE.length];
function sortSessions(){ db.sessions.sort((a,b) => b.t - a.t); }
function addGroup(name, color){ const g = {id:uid(), name:name.trim(), color: color || PALETTE[db.groups.length % PALETTE.length], tags:[]}; db.groups.push(g); return g; }
function ensureTag(g, tag){ if(tag && !g.tags.includes(tag)) g.tags.push(tag); }
function ctrMatches(c, s){ return s.g === c.g && (!c.tag || s.tags.includes(c.tag)); }
function tagCounts(gid){ const m = new Map(); db.sessions.forEach(s => { if(s.g === gid) s.tags.forEach(t => m.set(t, (m.get(t)||0)+1)); }); return m; }

/* ───────── helpers ───────── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDate = t => { const d = new Date(t); return `${DOW[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`; };
const fmtTime = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function sinceHTML(t){
  let s = Math.max(0, Math.floor((Date.now() - t)/1000));
  const d = Math.floor(s/86400); s -= d*86400;
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  return `${d}<span class="u">${d===1?'day':'days'}</span>${pad(h)}:${pad(m)}:${pad(s)}`;
}
function gapText(ms){ const d = ms/DAY; if(d < 1) return Math.round(ms/3600000) + ' h'; if(d < 60) return (d < 10 ? d.toFixed(1) : Math.round(d)) + ' d'; return (d/30.44).toFixed(1) + ' mo'; }
const monthKey = t => { const d = new Date(t); return d.getFullYear()*12 + d.getMonth(); };
const mkLabel = k => `${pad(k%12+1)}/${String(Math.floor(k/12)).slice(2)}`;
const pct = (a,b) => b ? Math.round(a/b*100) + '%' : '–';
function tagSections(tags){
  // group tags by a short prefix like "B-" / "E-" / "M-"; everything else under "Other"
  const by = new Map();
  tags.forEach(t => { const m = t.match(/^([A-Za-z]{1,2})-/); const k = m ? m[1].toUpperCase() : ''; if(!by.has(k)) by.set(k, []); by.get(k).push(t); });
  const out = []; let other = by.get('') || [];
  by.forEach((v,k) => { if(!k) return; if(v.length < 2) other = other.concat(v); else out.push([k + '-', v]); });
  out.sort((a,b) => a[0].localeCompare(b[0]));
  if(other.length) out.push([out.length ? 'Other' : '', other]);
  return out;
}

/* BASELINE — "what's normal" over a chosen period */
function periodList(){
  const now = Date.now(), ys = [...new Set(db.sessions.map(s => new Date(s.t).getFullYear()))].sort((a,b) => b-a);
  const mStart = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m-1, 1).getTime(); };
  const mEnd = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m, 1).getTime(); };
  return [
    {id:'3m',  name:'Last 3 months',  short:'3 months',  from: now - 91*DAY},
    {id:'6m',  name:'Last 6 months',  short:'6 months',  from: now - 182*DAY},
    {id:'12m', name:'Last 12 months', short:'12 months', from: now - 365*DAY},
    ...db.periods.map(p => ({id:p.id, name:p.name, short:p.name, from:mStart(p.from), to:p.to ? mEnd(p.to) : null, custom:true})),
    ...ys.map(y => ({id:'y'+y, name:String(y), short:String(y), from:new Date(y,0,1).getTime(), to:new Date(y+1,0,1).getTime()})),
    {id:'all', name:'All time', short:'all time', from:0}
  ];
}
function curPeriod(){ const l = periodList(); return l.find(p => p.id === ui.period) || l.find(p => p.id === '12m'); }
function quant(sorted, q){ if(!sorted.length) return 0; const i = (sorted.length-1)*q, lo = Math.floor(i), hi = Math.ceil(i); return sorted[lo] + (sorted[hi]-sorted[lo])*(i-lo); }
// ssAsc: sessions oldest→newest. Gaps counted between consecutive sessions that both fall inside the period.
function baseline(ssAsc, per){
  const to = per.to || Infinity, inP = ssAsc.filter(s => s.t >= per.from && s.t < to);
  const gaps = []; for(let i = 1; i < inP.length; i++) gaps.push(inP[i].t - inP[i-1].t);
  const g = gaps.slice().sort((a,b) => a-b);
  return {n:inP.length, gaps, sorted:g, med:quant(g,.5), p25:quant(g,.25), p75:quant(g,.75), p90:quant(g,.9), max:g[g.length-1]||0, mean:g.length ? g.reduce((a,b)=>a+b,0)/g.length : 0};
}
const dd = ms => { const d = ms/DAY; return d < 1 ? '<1' : d < 10 ? (Math.round(d*2)/2).toString().replace(/\.0$/,'') : String(Math.round(d)); };
function normBlock(ssAsc, color, cur){
  const per = curPeriod(), b = baseline(ssAsc, per);
  if(b.gaps.length < 4) return `<div class="norm"><div class="norm-line muted">Not enough sessions in ${esc(per.short)} to know what's normal — try a longer period.</div></div>`;
  const share = b.sorted.filter(x => x >= cur).length / b.sorted.length;
  const inTen = `${Math.max(1, Math.round(share*10))} in 10`;
  let head, sub;
  if(cur < b.p25){ head = 'Early days'; sub = `the next one usually comes between day ${dd(b.p25)} and day ${dd(b.p75)}`; }
  else if(cur <= b.p75){ head = 'Within your usual range'; sub = cur <= b.med ? `typical gap is ${dd(b.med)} days` : `past the typical ${dd(b.med)} days — ${inTen} gaps go this long`; }
  else if(cur <= b.p90){ head = 'Longer than most, still common'; sub = `about ${inTen} gaps go this long`; }
  else if(cur <= b.max){ head = 'A longer gap'; sub = `about ${inTen} gaps go this long · longest was ${dd(b.max)} days`; }
  else { head = 'Longer than any gap in this period'; sub = `previous longest was ${dd(b.max)} days`; }
  const scale = Math.max(b.p90 * 1.3, cur * 1.08, b.med * 2.2, 3*DAY);
  const at = v => Math.min(100, v/scale*100).toFixed(1);
  return `<div class="norm" style="--c:${color}">
    <div class="norm-line"><b>${head}</b> · ${sub}</div>
    <div class="nbar" aria-hidden="true"><span class="band" style="left:${at(b.p25)}%;width:${(at(b.p75)-at(b.p25)).toFixed(1)}%"></span><span class="med" style="left:${at(b.med)}%"></span><span class="cur" style="left:${at(cur)}%"></span></div>
    <div class="norm-sub">Usual ${dd(b.p25)}–${dd(b.p75)} days · typical ${dd(b.med)} · average ${dd(b.mean)} <span class="muted">(${esc(per.short)})</span></div>
  </div>`;
}

/* LONG-PRESS DRAG TO REORDER
   Hold ~0.4 s on a .dz child, then drag. Moving before the hold fires = normal scroll. */
let dragging = null, suppressClick = false, mouseHooked = false;
const sortBoxes = new Set();
function makeSortable(box, onDrop){
  if(!box) return;
  const HOLD = 400, SLOP = 8;
  let timer = null, sx = 0, sy = 0, cand = null;
  const kids = () => [...box.children].filter(x => x.classList.contains('dz'));
  const place = () => {
    const d = dragging; if(!d) return;
    const el = d.el; el.style.transform = '';
    const want = d.y - d.grab, h = el.offsetHeight;
    for(let guard = 0; guard < 20; guard++){
      const prev = el.previousElementSibling, next = el.nextElementSibling;
      if(prev && prev.classList.contains('dz')){ const r = prev.getBoundingClientRect(); if(want < r.top + r.height/2){ box.insertBefore(el, prev); continue; } }
      if(next && next.classList.contains('dz')){ const r = next.getBoundingClientRect(); if(want + h > r.top + r.height/2){ box.insertBefore(next, el); continue; } }
      break;
    }
    el.style.transform = `translateY(${want - el.getBoundingClientRect().top}px)`;
  };
  const begin = (el, y) => {
    cand = null; const r = el.getBoundingClientRect();
    dragging = {el, box, grab: y - r.top, y, raf: 0, place, finish};
    el.classList.add('lifted'); box.classList.add('sorting'); document.documentElement.classList.add('no-anchor');
    if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}
    const loop = () => {
      if(!dragging || dragging.el !== el) return;
      const edge = 70, vh = innerHeight, yy = dragging.y;
      const v = yy < edge ? -Math.ceil((edge-yy)/6) : yy > vh-edge ? Math.ceil((yy-(vh-edge))/6) : 0;
      if(v){ scrollBy(0, v); place(); }
      dragging.raf = requestAnimationFrame(loop);
    };
    dragging.raf = requestAnimationFrame(loop);
    place();
  };
  function finish(){
    clearTimeout(timer); cand = null;
    const d = dragging; if(!d || d.box !== box) return;
    cancelAnimationFrame(d.raf); dragging = null;
    d.el.classList.remove('lifted'); d.el.style.transform = ''; box.classList.remove('sorting'); document.documentElement.classList.remove('no-anchor');
    suppressClick = true; setTimeout(() => suppressClick = false, 350);
    onDrop(kids().map(x => x.dataset.k));
    if(pendingRender && !sheetEl){ pendingRender = false; setTimeout(render, 0); }
  }
  const down = (x, y, target) => {
    const el = target.closest('.dz'); if(!el || el.parentElement !== box || dragging) return;
    cand = el; sx = x; sy = y; clearTimeout(timer);
    timer = setTimeout(() => { if(cand === el && el.isConnected) begin(el, y); }, HOLD);
  };
  const move = (x, y) => {
    if(dragging && dragging.box === box){ dragging.y = y; place(); return true; }
    if(cand && (Math.abs(x-sx) > SLOP || Math.abs(y-sy) > SLOP)){ clearTimeout(timer); cand = null; }
    return false;
  };
  box.addEventListener('touchstart', e => { if(e.touches.length === 1) down(e.touches[0].clientX, e.touches[0].clientY, e.target); else { clearTimeout(timer); cand = null; } }, {passive:true});
  box.addEventListener('touchmove', e => { if(move(e.touches[0].clientX, e.touches[0].clientY)) e.preventDefault(); }, {passive:false});
  box.addEventListener('touchend', finish); box.addEventListener('touchcancel', finish);
  box.addEventListener('mousedown', e => { if(e.button === 0) down(e.clientX, e.clientY, e.target); });
  box._move = move; box._finish = finish;
  box.addEventListener('contextmenu', e => { if(cand || dragging) e.preventDefault(); });
  if(!mouseHooked){
    mouseHooked = true;
    addEventListener('mousemove', e => { const b = dragging ? dragging.box : null; document.querySelectorAll('#sortNow,#sortCharts').forEach(x => x._move && (b ? x === b : true) && x._move(e.clientX, e.clientY)); });
    addEventListener('mouseup', () => document.querySelectorAll('#sortNow,#sortCharts').forEach(x => x._finish && x._finish()));
  }
}
document.addEventListener('click', e => { if(suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

/* CHARTS */
function niceStep(max){ if(max <= 5) return 1; const raw = max/4, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function svgLine(keys, series, h=200){
  const W = 340, H = h, L = 26, R = 6, T = 8, B = 22, n = keys.length; if(!n) return '';
  const max = Math.max(1, ...series.flatMap(s => s.vals.filter(v => v != null)));
  const step = niceStep(max), top = Math.ceil(max/step)*step;
  const x = i => L + (n === 1 ? (W-L-R)/2 : i*(W-L-R)/(n-1)), y = v => T + (H-T-B)*(1 - v/top);
  let g = '';
  for(let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const every = Math.max(1, Math.ceil(n/6));
  keys.forEach((k,i) => { if((n-1-i) % every === 0) g += `<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${mkLabel(k)}</text>`; });
  g += `<line class="base" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>`;
  series.forEach(s => {
    let d = '', pen = false;
    s.vals.forEach((v,i) => { if(v == null){ pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||1.8}" ${s.dash ? 'stroke-dasharray="4 3"' : ''} stroke-linejoin="round" stroke-linecap="round" opacity="${s.op||1}"/>`;
    if(s.dots && n <= 40) s.vals.forEach((v,i) => { if(v != null) g += `<circle cx="${x(i)}" cy="${y(v)}" r="2.4" fill="${s.color}"/>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function svgBars(labels, vals, color, h=170, hi=-1){
  const W = 340, H = h, L = 26, R = 4, T = 14, B = 22, n = labels.length, max = Math.max(1, ...vals);
  const step = niceStep(max), top = Math.ceil(max/step)*step, bw = (W-L-R)/n, y = v => T + (H-T-B)*(1 - v/top);
  let g = '';
  for(let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  vals.forEach((v,i) => {
    const x0 = L + i*bw + bw*0.14, w = bw*0.72;
    if(v > 0) g += `<rect x="${x0}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="3" fill="${color}" opacity="${hi>=0 && i!==hi ? .55 : 1}"/>`;
    if(v > 0 && n <= 14) g += `<text class="ax" x="${x0+w/2}" y="${y(v)-3}" text-anchor="middle" style="fill:var(--paper)">${+v.toFixed(1)}</text>`;
    g += `<text class="ax" x="${x0+w/2}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  g += `<line class="base" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function hbars(rows, color, total){

  blocks.year = yearCard(ss, color);
  blocks.dow = `<section class="card">
    <div class="card-h"><h2>Day of week</h2><span class="sub">most often ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][topDow]}</span></div>
    ${svgBars(['M','T','W','T','F','S','S'], dow, color, 160, topDow)}
  </section>`;
  blocks.tod = `<section class="card">
    <div class="card-h"><h2>Time of day</h2></div>
    ${hbars(hrs.map((v,i) => [`${bands[i][0]} <span style="color:var(--muted);font-size:11px">${bands[i][1]}</span>`, v]), color)}
  </section>`;
  blocks.mix = mixRows.length ? `<section class="card">
    <div class="card-h"><h2>${ui.ctag ? 'Often with' : 'Tag mix'}</h2><span class="seg"><button class="${ui.mixRange==='12m'?'on':''}" data-act="mix" data-v="12m">12M</button><button class="${ui.mixRange==='all'?'on':''}" data-act="mix" data-v="all">All</button></span></div>
    <p class="help" style="margin:-4px 0 6px">Share of ${mixFrom.length} ${ui.ctag ? esc(ui.ctag) + ' ' : ''}sessions that included each tag.</p>
    ${hbars(mixRows, color, mixFrom.length)}
  </section>` : '';
  const order = chartOrder();
  html += `<div id="sortCharts" style="display:grid;gap:14px">${order.filter(k => blocks[k]).map(k => `<div class="dz" data-k="${k}">${blocks[k]}</div>`).join('')}</div>
    <p class="help" style="text-align:center">Hold a chart to move it${ui.chartOrder ? ' · <button class="linkbtn" data-act="resetOrder" style="padding:0;font-size:12.5px">reset order</button>' : ''}</p>`;
  view.innerHTML = html;
  makeSortable(document.getElementById('sortCharts'), keys => { ui.chartOrder = keys; saveUI(); setTimeout(render, 0); });
}
const CHART_KEYS = ['stats','gaps','month','last12','year','dow','tod','mix'];
function gapsCard(ss, bl, per, cur, color){
  const B = [[0,3,'0–3'],[3,7,'4–7'],[7,14,'1–2w'],[14,21,'2–3w'],[21,31,'3–4w'],[31,Infinity,'4w+']];
  const counts = B.map(([a,b]) => bl.gaps.filter(g => g/DAY >= a && g/DAY < b).length);
  const curB = B.findIndex(([a,b]) => cur/DAY >= a && cur/DAY < b);
  // typical gap by year, for perspective
  const ys = [...new Set(ss.map(s => new Date(s.t).getFullYear()))].sort();
  const yMed = ys.map(y => { const b = baseline(ss, {from:new Date(y,0,1).getTime(), to:new Date(y+1,0,1).getTime()}); return b.gaps.length >= 2 ? Math.round(b.med/DAY*10)/10 : 0; });
  return `<section class="card">
    <div class="card-h"><h2>What's normal</h2><span class="sub">gaps between sessions</span></div>
    ${periodChips()}
    ${bl.gaps.length >= 2 ? `
      <p class="help" style="margin:8px 0 4px">In <b>${esc(per.name.toLowerCase().startsWith('last') ? 'the ' + per.name.toLowerCase() : per.name)}</b>: typical gap <b>${dd(bl.med)} days</b>, usual range <b>${dd(bl.p25)}–${dd(bl.p75)}</b>, average ${dd(bl.mean)}, longest ${dd(bl.max)}. ${bl.n} sessions.</p>
      ${svgBars(B.map(x => x[2]), counts, color, 160, curB)}
      <p class="help" style="margin:2px 0 0;text-align:center">How long gaps lasted · darker bar = where today's gap sits</p>` : `<p class="help" style="margin-top:8px">Not enough sessions in ${esc(per.short)}.</p>`}
    ${ys.length > 1 ? `<div class="card-h" style="margin:14px 0 4px"><h2 style="font-size:18px">Typical gap by year</h2><span class="sub">days</span></div>
      ${svgBars(ys.map(y => "'" + String(y).slice(2)), yMed, color, 130, ys.indexOf(new Date().getFullYear()))}` : ''}
  </section>`;
}
function chartOrder(){
  const o = Array.isArray(ui.chartOrder) ? ui.chartOrder.filter(k => CHART_KEYS.includes(k)) : [];
  return o.concat(CHART_KEYS.filter(k => !o.includes(k)));
}
function yearCard(ss, color){
  const by = new Map(); ss.forEach(s => { const y = new Date(s.t).getFullYear(); by.set(y, (by.get(y)||0)+1); });
  const ys = [...by.keys()].sort(); if(ys.length < 2) return '';
  const cy = new Date().getFullYear(), frac = (Date.now() - new Date(cy,0,1)) / (new Date(cy+1,0,1) - new Date(cy,0,1));
  return `<section class="card">
    <div class="card-h"><h2>By year</h2><span class="sub">${cy} on pace for ≈${Math.round((by.get(cy)||0)/frac)}</span></div>
    ${svgBars(ys.map(y => "'" + String(y).slice(2)), ys.map(y => by.get(y)), color, 150, ys.indexOf(cy))}
  </section>`;
}

/* LOG */
function renderLog(){
  if(ui.lg !== 'all' && !grp(ui.lg)) ui.lg = 'all';
  const q = ui.q.trim().toLowerCase();
  let list = db.sessions.filter(s => (ui.lg === 'all' || s.g === ui.lg) && grp(s.g));
  if(q) list = list.filter(s => s.tags.some(t => t.toLowerCase().includes(q)) || (s.note||'').toLowerCase().includes(q));
  const total = list.length; const shown = list.slice(0, ui.limit);
  let html = `<div class="chips"><button class="chip ${ui.lg==='all'?'on':''}" data-act="lg" data-g="all">All</button>${db.groups.map(g => `<button class="chip ${ui.lg===g.id?'on':''}" style="--c:${g.color}" data-act="lg" data-g="${g.id}"><i></i>${esc(g.name)}</button>`).join('')}</div>
    <input class="search" id="q" type="search" placeholder="Search tags and notes" value="${esc(ui.q)}">`;
  if(!shown.length) html += `<div class="card empty">No sessions${q ? ' match that search' : ''}.</div>`;
  const monthN = new Map(); list.forEach(s => { const k = monthKey(s.t); monthN.set(k, (monthN.get(k)||0)+1); });
  let curK = null, buf = '';
  const flush = () => { if(buf) html += `<div class="rows">${buf}</div>`; buf = ''; };
  shown.forEach(s => {
    const k = monthKey(s.t), g = grp(s.g);
    if(k !== curK){ flush(); curK = k; html += `<div class="month-h"><span>${MON[k%12]} ${Math.floor(k/12)}</span><span>${monthN.get(k)}</span></div>`; }
    buf += `<button class="row" style="--c:${g.color}" data-act="edit" data-id="${s.id}"><i></i>
      <span style="min-width:0"><div class="nm">${esc(g.name)}</div>
        ${s.tags.length ? `<div class="mini-tags">${s.tags.map(t => `<span class="mt">${esc(t)}</span>`).join('')}</div>` : ''}
        ${s.note ? `<div class="nt">${esc(s.note)}</div>` : ''}</span>
      <span class="dt">${fmtDate(s.t)}<br>${fmtTime(s.t)}</span></button>`;
  });
  flush();
  if(total > shown.length) html += `<button class="btn more" data-act="more">Show more (${total - shown.length} older)</button>`;
  view.innerHTML = html;
  const qi = document.getElementById('q');
  qi.addEventListener('input', () => { ui.q = qi.value; ui.limit = 120; const pos = qi.selectionStart; renderLog(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); });
}

/* ───────── sheets ───────── */
let sheetEl = null;
function openSheet(html, onMount){
  closeSheet();
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role','dialog'); sh.innerHTML = html;
  scrim.addEventListener('click', closeSheet);
  document.body.append(scrim, sh); sheetEl = {scrim, sh};
  sh.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
  onMount && onMount(sh);
}
function closeSheet(){ if(sheetEl){ sheetEl.scrim.remove(); sheetEl.sh.remove(); sheetEl = null; } if(pendingRender && V){ pendingRender = false; render(); } }

function sessionSheet(opts){
  if(!db.groups.length){ newGroupPrompt(); return; }
  const s = opts.id ? db.sessions.find(x => x.id === opts.id) : null;
  let gid = s ? s.g : (grp(opts.g) ? opts.g : db.groups[0].id);
  let tags = new Set(s ? s.tags : (opts.tag ? [opts.tag] : []));
  openSheet(`
    <div class="sheet-head"><h3>${s ? 'Edit session' : 'Log session'}</h3><button class="x" data-close aria-label="Close">✕</button></div>
    <div class="chips" id="gPick"></div>
    <div id="tagPick" style="display:grid;gap:10px"></div>
    <div class="field"><span>When · <b id="whenTxt" style="letter-spacing:0;text-transform:none;color:var(--paper);font-family:Inter,sans-serif;font-size:12.5px"></b></span>
      <div class="cal" id="cal"></div>
      <div class="time-row"><input type="time" id="fTime" value="${fmtTime(s ? s.t : Date.now())}" aria-label="Time"><button class="chip" data-now>Now</button></div>
    </div>
    <label class="field"><span>Note</span><textarea id="fN" placeholder="optional">${esc(s ? s.note : '')}</textarea></label>
    <button class="btn primary block" id="fSave">${s ? 'Save changes' : 'Log it'}</button>
    ${s ? `<button class="btn danger block" id="fDel">Delete session</button>` : ''}
  `, sh => {
    const draw = () => {
      const g = grp(gid), tc = tagCounts(gid);
      sh.querySelector('#gPick').innerHTML = db.groups.map(x => `<button class="chip ${x.id===gid?'on':''}" style="--c:${x.color}" data-pg="${x.id}"><i></i>${esc(x.name)}</button>`).join('');
      const ordered = g.tags.slice().sort((a,b) => (tc.get(b)||0) - (tc.get(a)||0));
      sh.querySelector('#tagPick').innerHTML = tagSections(ordered).map(([h, ts]) => `<div class="tagsec">${h ? `<span class="lbl">${esc(h)}</span>` : ''}<div class="chips wrap">${ts.map(t => `<button class="chip tag ${tags.has(t)?'on':''}" style="--c:${g.color}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>`).join('')
        + `<div class="chips wrap"><button class="chip add" data-newtag>+ new tag</button></div>`;
    };
    // calendar
    const t0 = s ? s.t : Date.now(), d0 = new Date(t0);
    let sel = {y:d0.getFullYear(), m:d0.getMonth(), d:d0.getDate()};
    let vm = sel.y*12 + sel.m;
    const timeIn = sh.querySelector('#fTime');
    const dayKey = (y,m,d) => y*10000 + m*100 + d;
    const drawCal = () => {
      const now = new Date(), nowK = now.getFullYear()*12 + now.getMonth(), todayKey = dayKey(now.getFullYear(), now.getMonth(), now.getDate());
      const y = Math.floor(vm/12), m = vm%12, g = grp(gid);
      const has = new Set(); db.sessions.forEach(x => { if(x.g === gid && x !== s){ const q = new Date(x.t); if(q.getFullYear() === y && q.getMonth() === m) has.add(q.getDate()); } });
      const lead = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m+1, 0).getDate();
      let cells = ['M','T','W','T','F','S','S'].map(x => `<span class="dh">${x}</span>`).join('') + '<span></span>'.repeat(lead);
      for(let d = 1; d <= days; d++){
        const k = dayKey(y,m,d), cls = ['d'];
        if(k === todayKey) cls.push('today');
        if(sel.y === y && sel.m === m && sel.d === d) cls.push('sel');
        if(has.has(d)) cls.push('has');
        cells += `<button class="${cls.join(' ')}" data-day="${d}" ${k > todayKey ? 'disabled' : ''}>${d}</button>`;
      }
      sh.querySelector('#cal').style.setProperty('--c', g.color);
      sh.querySelector('#cal').innerHTML = `<div class="cal-h"><button class="x" data-cm="-1" aria-label="Previous month">‹</button><span>${MONTHS[m]} ${y}</span><button class="x" data-cm="1" aria-label="Next month" ${vm >= nowK ? 'disabled' : ''}>›</button></div><div class="cal-g">${cells}</div>`;
      const sd = new Date(sel.y, sel.m, sel.d);
      sh.querySelector('#whenTxt').textContent = `${DOW[sd.getDay()]} ${sd.getDate()} ${MON[sel.m]} ${sel.y}${k0(sd) === todayKey ? ' (today)' : ''}`;
    };
    const k0 = d => dayKey(d.getFullYear(), d.getMonth(), d.getDate());
    sh.querySelector('#cal').addEventListener('click', ev => {
      const cm = ev.target.closest('[data-cm]'); if(cm && !cm.disabled){ vm += +cm.dataset.cm; drawCal(); return; }
      const b = ev.target.closest('[data-day]'); if(b && !b.disabled){ sel = {y:Math.floor(vm/12), m:vm%12, d:+b.dataset.day}; drawCal(); }
    });
    sh.querySelector('[data-now]').addEventListener('click', () => { const n = new Date(); sel = {y:n.getFullYear(), m:n.getMonth(), d:n.getDate()}; vm = sel.y*12 + sel.m; timeIn.value = fmtTime(n); drawCal(); });
    draw(); drawCal();
    sh.querySelector('#gPick').addEventListener('click', ev => { const b = ev.target.closest('[data-pg]'); if(b && b.dataset.pg !== gid){ gid = b.dataset.pg; tags = new Set(); draw(); drawCal(); } });
    sh.querySelector('#tagPick').addEventListener('click', ev => {
      const b = ev.target.closest('[data-t]');
      if(b){ const t = b.dataset.t; tags.has(t) ? tags.delete(t) : tags.add(t); b.classList.toggle('on', tags.has(t)); return; }
      if(ev.target.closest('[data-newtag]')){ const n = (prompt('New tag for ' + grp(gid).name) || '').trim(); if(n){ ensureTag(grp(gid), n); tags.add(n); save(); draw(); } }
    });
    sh.querySelector('#fSave').addEventListener('click', () => {
      const [hh, mm] = (timeIn.value || '').split(':').map(Number);
      if(!isFinite(hh) || !isFinite(mm)){ toast('Pick a time'); return; }
      let t = new Date(sel.y, sel.m, sel.d, hh, mm).getTime();
      if(s && Math.floor(s.t/60000) === Math.floor(t/60000)) t = s.t;          // unchanged → keep exact stamp
      else if(!s && sel.d === d0.getDate() && sel.m === d0.getMonth() && sel.y === d0.getFullYear() && timeIn.value === fmtTime(t0)) t = t0;
      if(t > Date.now() + 60000){ toast('That time is in the future'); return; }
      const order = grp(gid).tags;
      const rec = {g:gid, t, tags:[...tags].sort((a,b) => order.indexOf(a) - order.indexOf(b)), note: sh.querySelector('#fN').value.trim()};
      let added = null;
      if(s) Object.assign(s, rec); else { added = Object.assign({id:uid()}, rec); db.sessions.push(added); }
      sortSessions(); save(); closeSheet(); render();
      if(added) toast(`${grp(gid).name} logged`, 'Undo', () => { db.sessions = db.sessions.filter(x => x !== added); save(); render(); });
    });
    if(s) sh.querySelector('#fDel').addEventListener('click', () => {
      db.sessions = db.sessions.filter(x => x !== s); save(); closeSheet(); render();
      toast('Session deleted', 'Undo', () => { db.sessions.push(s); sortSessions(); save(); render(); });
    });
  });
}

        save(); render(); reopen(); return;
      }
      if(ev.target.closest('[data-tadd]')){ const n = (prompt('New tag for ' + g.name) || '').trim(); if(n){ ensureTag(g, n); save(); reopen(); } return; }
      const tb = ev.target.closest('[data-tag]'); if(!tb) return;
      const old = tb.dataset.tag, n = tagCounts(g.id).get(old) || 0;
      const nu = prompt(`Rename "${old}" (used in ${n} sessions).\nLeave empty to remove the tag from all of them.`, old);
      if(nu === null) return;
      const name = nu.trim();
      if(!name){
        if(!confirm(`Remove "${old}" from ${n} sessions?`)) return;
        g.tags = g.tags.filter(t => t !== old);
        db.sessions.forEach(s => { if(s.g === g.id) s.tags = s.tags.filter(t => t !== old); });
        db.counters.forEach(c => { if(c.g === g.id && c.tag === old) c.tag = null; });
      } else if(name !== old){
        const merge = g.tags.includes(name);
        g.tags = merge ? g.tags.filter(t => t !== old) : g.tags.map(t => t === old ? name : t);
        db.sessions.forEach(s => { if(s.g === g.id && s.tags.includes(old)){ s.tags = s.tags.filter(t => t !== old); if(!s.tags.includes(name)) s.tags.push(name); } });
        db.counters.forEach(c => { if(c.g === g.id && c.tag === old) c.tag = name; });
      }
      save(); render(); reopen();
    });
    sh.querySelector('#gAdd').addEventListener('click', () => { const n = (prompt('Group name') || '').trim(); if(n){ addGroup(n); save(); render(); reopen(); } });
    // import / export
    sh.querySelector('#kLock').addEventListener('click', lock);
    sh.querySelector('#kPin').addEventListener('click', () => { closeSheet(); verifyPin('Current PIN', () => choosePin('New PIN', '', async pin => { await wrapVault(V.raw, pin); hideLock(); render(); toast('PIN changed'); }), () => { hideLock(); render(); }); });
    sh.querySelector('#kCode').addEventListener('click', () => { closeSheet(); verifyPin('Enter PIN to show code', () => showRecovery(false), () => { hideLock(); render(); }); });
    sh.querySelector('#kRemove').addEventListener('click', () => {
      if(!confirm(`Remove Tally from this phone? ${FIREBASE_CONFIG ? 'The synced copy stays in Firebase; you\'ll need the recovery code to add it back.' : 'Sync isn\'t set up, so this deletes the only copy.'}`)) return;
      if(prompt('Type REMOVE to confirm') !== 'REMOVE') return;
      stopSync(); [VAULT_KEY, BLOB_KEY, FAIL_KEY, STORE_KEY, UI_KEY].forEach(k => localStorage.removeItem(k));
      V = null; db = emptyDb(); lastV = 0; closeSheet(); welcomeScreen();
    });
    sh.querySelector('#sImp').addEventListener('click', () => document.getElementById('fileIn').click());
    sh.querySelector('#sJson').addEventListener('click', () => download(`tally-backup-${stamp()}.json`, JSON.stringify({app:'tally', version:VERSION, ...db}), 'application/json'));
    sh.querySelector('#sCsv').addEventListener('click', () => db.groups.forEach((g,i) => setTimeout(() => download(`TrackAndGraph-${g.name.replace(/[^\w-]+/g,'_')}-${stamp()}.csv`, toCSV(g.id), 'text/csv'), i*400)));
    sh.querySelector('#sWipe').addEventListener('click', () => {
      if(!confirm(`Delete every group, session and counter${FIREBASE_CONFIG ? ' — here and in the synced copy' : ''}? Export a backup first if you might want it.`)) return;
      if(prompt('Type DELETE to confirm') !== 'DELETE') return;
      db = {groups:[], sessions:[], counters:[]}; save(); closeSheet(); render(); toast('All data deleted');
    });
  });
}

/* ───────── import / export ───────── */
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`; };
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const csvCell = s => { s = String(s ?? ''); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
function isoLocal(t){
  const d = new Date(t), off = -d.getTimezoneOffset(), sg = off >= 0 ? '+' : '-', a = Math.abs(off);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,'0')}${sg}${pad(Math.floor(a/60))}:${pad(a%60)}`;
}
function toCSV(gid){
  const rows = ['FeatureName,Timestamp,Value,Label,Note'];
  sessOf(gid).forEach(s => (s.tags.length ? s.tags : ['(session)']).forEach((t,i) => rows.push([t, isoLocal(s.t), '1.0', '', i === 0 ? s.note : ''].map(csvCell).join(','))));
  return rows.join('\n');
}
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(cell); cell = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function groupFromFilename(fname){
  const m = fname.match(/TrackAndGraph-(.+?)-\d{8}-\d{6}/i);
  return m ? m[1].replace(/_+$/,'').replace(/_/g,' ').trim() : '';
}
function addSessionsDeduped(gid, list){
  const key = s => Math.floor(s.t/60000) + '|' + s.tags.slice().sort().join(',');
  const seen = new Set(db.sessions.filter(s => s.g === gid).map(key));
  let added = 0;
  list.forEach(s => { const k = key(s); if(seen.has(k)) return; seen.add(k); db.sessions.push(Object.assign({id:uid(), g:gid, note:''}, s)); added++; });
  return added;
}
function importCSV(text, fname){
  if(!text.trim()) throw new Error(`${fname} is empty`);
  const rows = parseCSV(text);
  const h = rows[0].map(x => x.trim().toLowerCase());
  const iF = h.indexOf('featurename'), iT = h.indexOf('timestamp'), iV = h.indexOf('value'), iL = h.indexOf('label'), iN = h.indexOf('note');
  if(iF < 0 || iT < 0 || iV < 0) throw new Error(`${fname}: expected FeatureName, Timestamp, Value columns`);
  const recs = [], nonUnit = new Map();
  rows.slice(1).forEach(r => {
    const name = (r[iF]||'').trim(), t = Date.parse((r[iT]||'').trim());
    if(!name || !isFinite(t)) return;
    let raw = (r[iV]||'').trim(), label = iL >= 0 ? (r[iL]||'').trim() : '';
    if(iL < 0){ const m = raw.match(/^(-?[\d.]+):(.*)$/); if(m && isNaN(+m[2].split(':')[0])){ raw = m[1]; label = m[2]; } }
    const v = parseFloat(raw);
    if(isFinite(v) && v !== 1) nonUnit.set(name, (nonUnit.get(name)||0) + 1);
    recs.push({name, t, label, note: iN >= 0 ? (r[iN]||'').trim() : ''});
  });
  const skipped = [...nonUnit.keys()];
  const keep = recs.filter(r => !nonUnit.has(r.name)).sort((a,b) => a.t - b.t);
  if(!keep.length) throw new Error(`${fname}: no rows to import`);

  // which group?
  const names = new Set(keep.map(r => r.name));
  let g = null, best = 0;
  db.groups.forEach(x => { const hit = [...names].filter(n => x.tags.includes(n)).length; if(hit > best){ best = hit; g = x; } });
  if(!g || best < names.size/2){
    let gname = groupFromFilename(fname);
    const existing = gname && db.groups.find(x => x.name.toLowerCase() === gname.toLowerCase());
    if(existing) g = existing;
    else { if(!gname) gname = (prompt(`Which group is ${fname}? (e.g. Sex, Solo)`) || '').trim(); if(!gname) throw new Error('Import cancelled'); g = addGroup(gname); }
  }
  // cluster into sessions
  const sessions = [];
  keep.forEach(r => {
    const tagsHere = [r.name].concat(r.label ? [r.label] : []);
    const cur = sessions[sessions.length-1];
    if(cur && r.t - cur.t < SESSION_WINDOW && !cur.tags.includes(r.name)){
      tagsHere.forEach(t => { if(!cur.tags.includes(t)) cur.tags.push(t); });
      if(r.note) cur.note = cur.note ? cur.note + ' · ' + r.note : r.note;
    } else sessions.push({t:r.t, tags:tagsHere, note:r.note});
  });
  // tag order: by frequency
  const freq = new Map(); sessions.forEach(s => s.tags.forEach(t => freq.set(t, (freq.get(t)||0)+1)));
  [...freq.keys()].sort((a,b) => freq.get(b) - freq.get(a)).forEach(t => ensureTag(g, t));
  sessions.forEach(s => s.tags.sort((a,b) => g.tags.indexOf(a) - g.tags.indexOf(b)));
  const added = addSessionsDeduped(g.id, sessions);
  return `${g.name}: ${added} session${added===1?'':'s'}${added < sessions.length ? ` (${sessions.length-added} already here)` : ''}${skipped.length ? ` · skipped ${skipped.join(', ')}` : ''}`;
}
function importJSON(text){
  const j = JSON.parse(text);
  if(!Array.isArray(j.groups) || !Array.isArray(j.sessions)) throw new Error('Not a Tally backup');
  const map = {}; const msgs = [];
  j.groups.forEach(x => {
    let g = db.groups.find(y => y.name.toLowerCase() === x.name.toLowerCase());
    if(!g) g = addGroup(x.name, x.color);
    (x.tags||[]).forEach(t => ensureTag(g, t)); map[x.id] = g.id;
  });
  j.groups.forEach(x => { const list = j.sessions.filter(s => s.g === x.id).map(s => ({t:+s.t, tags:(s.tags||[]).slice(), note:s.note||''})); msgs.push(`${x.name}: ${addSessionsDeduped(map[x.id], list)} sessions`); });
  if(!db.counters.length && Array.isArray(j.counters)) j.counters.forEach(c => { if(map[c.g]) db.counters.push({id:uid(), name:c.name, g:map[c.g], tag:c.tag||null, color:c.color}); });
  return msgs.join(' · ');
}
document.getElementById('fileIn').addEventListener('change', async ev => {
  const files = [...ev.target.files]; ev.target.value = ''; if(!files.length) return;
  const msgs = [];
  for(const f of files){
    try{ const txt = await f.text(); msgs.push(txt.trim().startsWith('{') ? importJSON(txt) : importCSV(txt, f.name)); }
    catch(err){ msgs.push('⚠ ' + err.message); }
  }
  sortSessions(); save();
  if(!db.counters.length) seedCounters();
  save(); closeSheet(); render();
  openSheet(`<div class="sheet-head"><h3>Import</h3><button class="x" data-close aria-label="Close">✕</button></div>
    ${msgs.map(m => `<p class="help" style="font-size:14px;color:var(--paper)">${esc(m)}</p>`).join('')}
    <button class="btn primary block" data-close>Done</button>`);
});
function seedCounters(){
  // one "any session" counter per group, plus the most-used tags that look like the old trackers
  db.groups.forEach(g => {
    db.counters.push({id:uid(), name:g.name, g:g.id, tag:null, color:g.color});
    const tc = tagCounts(g.id);
    ['PIV','B-Orgasm','E-Orgasm','M-Orgasm'].filter(t => tc.get(t)).forEach(t => db.counters.push({id:uid(), name:t, g:g.id, tag:t, color:nextColor()}));
  });
}

function verifyPin(title, ok, cancel){
  const rec = vaultRec();
  const box = pinScreen({title, len: rec.n, extra:'<button class="linkbtn" data-cancel>Cancel</button>', onPin: async pin => {
    try{ await aesDec(await pinKey(pin, unb64(rec.salt)), rec); ok(); return null; }catch(e){ return 'Wrong PIN'; }
  }});
  box.querySelector('[data-cancel]').onclick = cancel;
}

/* ───────── toast ───────── */
let toastT = null;
function toast(msg, action, fn){
  document.querySelectorAll('.toast').forEach(t => t.remove()); clearTimeout(toastT);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if(action){ const b = document.createElement('button'); b.textContent = action; b.onclick = () => { t.remove(); fn(); }; t.append(b); }
  document.body.append(t); toastT = setTimeout(() => t.remove(), action ? 5000 : 3200);
}

/* ───────── events ───────── */
document.querySelector('.tabs').addEventListener('click', ev => { const b = ev.target.closest('.tab'); if(b){ ui.tab = b.dataset.tab; render(); window.scrollTo(0,0); } });
document.getElementById('fab').addEventListener('click', () => sessionSheet({g: ui.tab==='charts' ? ui.cg : (ui.lg!=='all' ? ui.lg : null)}));
document.getElementById('openSettings').addEventListener('click', settingsSheet);
view.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, later = () => setTimeout(render, 0);
  if(a === 'add') sessionSheet({g:b.dataset.g, tag:b.dataset.tag || null});
  else if(a === 'edit') sessionSheet({id:b.dataset.id});
  else if(a === 'cg'){ ui.cg = b.dataset.g; ui.ctag = null; later(); }
  else if(a === 'ctag'){ ui.ctag = b.dataset.tag || null; later(); }
  else if(a === 'crange'){ ui.crange = b.dataset.v; later(); }
  else if(a === 'mix'){ ui.mixRange = b.dataset.v; later(); }
  else if(a === 'lg'){ ui.lg = b.dataset.g; ui.limit = 120; later(); }
  else if(a === 'more'){ ui.limit += 300; later(); }
  else if(a === 'period'){ ui.period = b.dataset.p; saveUI(); later(); }
  else if(a === 'newPeriod') periodSheet();
  else if(a === 'resetOrder'){ ui.chartOrder = null; saveUI(); later(); }
  else if(a === 'import') document.getElementById('fileIn').click();
  else if(a === 'newGroup') newGroupPrompt();
});
document.addEventListener('keydown', ev => { if(ev.key === 'Escape') closeSheet(); });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(V && hiddenAt && Date.now() - hiddenAt > LOCK_AFTER) return lock();
  if(V && ui.tab === 'now' && !sheetEl) render();
});
